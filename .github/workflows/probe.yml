name: Probe
on:
  push:
    branches: [probe]
    paths: [probe/probe.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node probe/probe.mjs
      - run: |
          git config user.name "probe"; git config user.email "bot@users.noreply.github.com"
          git add probe/results.json; git commit -m "probe results" && git push
