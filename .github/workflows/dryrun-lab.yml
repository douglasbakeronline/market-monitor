name: Dry run (lab)
# Swing lab round 2 (drift study), 10 Nov
on:
  push:
    branches: [dryrun-lab]
permissions:
  contents: write
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          node tools/drift-study.mjs > dry-run/drift-study.json 2> dry-run/drift-study.log; echo "exit=$?" >> dry-run/drift-study.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
