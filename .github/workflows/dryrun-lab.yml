name: Dry run (lab)
# Swing lab round 4 (earnings surprise), 10 Nov
on:
  push:
    branches: [dryrun-lab]
permissions:
  contents: write
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          sed -i 's|  return !nyOpen \&\& !lonOpen;|  return true; // dry run only|' scan.js && grep -n 'dry run only' scan.js
          DRY_RUN=1 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          node tools/surprise-study.mjs > dry-run/surprise-study.json 2> dry-run/surprise-study.log; echo "exit=$?" >> dry-run/surprise-study.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
