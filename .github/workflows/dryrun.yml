name: Dry run
# Core fund gap fill, 11 Nov.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node -e 'console.log(JSON.stringify(require("./dry-run/data.json").coreFund))' > dry-run/corefund.json 2>&1
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
