name: Dry run
# Greed and trim wording follow the rebalance rule (14 Nov, 10:41).
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          DRY_RUN=1 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node --input-type=module -e '
            import fs from "node:fs";
            import { regime } from "./src/signals.js";
            import { regimeNote } from "./src/research.js";
            const r = JSON.parse(fs.readFileSync("research.json"));
            const notes = JSON.stringify(r).match(/"regimeNote":(null|"[^"]*")/g) ?? [];
            console.log("research regimeNotes", notes.length, [...new Set(notes)]);
            const sp = { drawdownPct: -1, vs200Pct: 12, above200: true, peak: 7000 };
            console.log("overheated:", regime({ sp, vix: { level: 12 }, fg: { score: 85 } }).action);
            console.log("euphoric note:", regimeNote("euphoric", "Good entry"));
          ' > dry-run/wording.txt 2>&1
          cp scan.json data.json dry-run/ 2>/dev/null
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
