name: Dry run
# Short-term pot skip list (test entry BRBY.L from 12 Nov on this branch only), 13 Nov.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          cp history/short-pot.json dry-run/short-pot-before.json
          SHORT_FORCE=1 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          cp history/short-pot.json dry-run/short-pot-after.json
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node -e '
            const s = JSON.parse(require("fs").readFileSync("scan.json"));
            const p = s.shortTerm?.pot ?? {};
            console.log("skipList", JSON.stringify(p.skipList), "open", (p.open ?? []).map((o) => o.symbol), "buys", (p.buys ?? []).map((b) => b.symbol));
            console.log("just", JSON.stringify((s.resultsPreview?.just ?? []).map((j) => [j.symbol, j.potBuy, j.potSkip ?? false])));
          ' > dry-run/pot.txt 2>&1
          cp scan.json data.json dry-run/ 2>/dev/null
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
