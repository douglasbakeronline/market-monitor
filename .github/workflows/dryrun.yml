name: Dry run
# 19 Nov 11:41 build: backup prices end to end for London two-letter tickers and Europe against Yahoo; monitor; tests.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -f dry-run/*.html dry-run/*.gz dry-run/*.json dry-run/probe.log
          mkdir -p dry-run
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node -e 'import("./src/data/prices.js").then(async ({ fetchDaily }) => { for (const s of ["BA.L", "BP.L", "JD.L", "UU.L", "NG.L", "RR.L", "SN.L", "AV.L", "AZN.L", "BT-A.L", "VWRP.L", "MC.PA", "ASML.AS"]) { try { const y = await fetchDaily(s, { range: "1y", backup: false }); process.env.PRICES_FORCE_BACKUP = "1"; const c = await fetchDaily(s, { range: "1y" }); delete process.env.PRICES_FORCE_BACKUP; const ym = new Map(y.rows.map((r) => [r.date, r.close])); const com = c.rows.filter((r) => ym.has(r.date)).slice(-60); const max = Math.max(...com.map((r) => Math.abs(r.close / ym.get(r.date) - 1) * 100)); console.log(s, c.source, c.currency, "vs", y.currency, com.length, "common, max diff", max.toFixed(3) + "%"); } catch (e) { delete process.env.PRICES_FORCE_BACKUP; console.log(s, "failed:", e.message); } } })' > dry-run/backup-uk.log 2>&1; echo "exit=$?" >> dry-run/backup-uk.log
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
