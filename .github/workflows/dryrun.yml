name: Dry run
# Results preview: hand-kept FTSE 100 dates read as that session, 13 Nov (14:41).
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          node -e '
            const s = JSON.parse(require("fs").readFileSync("scan.json"));
            const r = s.resultsPreview ?? {};
            for (const x of [...(r.focus ?? []), ...(r.watch ?? [])]) console.log(x.focus ? "focus" : "watch", x.ticker, x.date, "typical", x.typical, JSON.stringify(x.moves));
            console.log("potCount", r.potCount);
            for (const sym of ["SSE.L","EXPN.L","BLND.L","IMB.L"]) { const it = s.items.find((i) => i.symbol === sym); console.log(sym, JSON.stringify(it?.resultsCheck ?? null)); }
          ' > dry-run/preview.txt 2>&1
          cp scan.json data.json dry-run/ 2>/dev/null
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
