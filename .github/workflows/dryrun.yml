name: Dry run
# 20 Nov 22:41 build: Just reported names get the pot's real outcome; preview in short-term.json.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -rf dry-run
          mkdir -p dry-run
          node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          cp history/short-term.json dry-run/short-term.json; cp data.json dry-run/data.json
          node -e 'const s=require("./scan.json");console.log(JSON.stringify(s.resultsPreview,null,1))' > dry-run/preview.json
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
