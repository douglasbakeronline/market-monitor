name: Dry run
# UK REIT hint (BBOX.L): why no cash-flow view, 12 Nov.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          node --input-type=module -e '
            import { fetchFundamentals } from "./src/data/fundamentals.js";
            for (const s of ["BBOX.L","LMP.L"]) { const f = await fetchFundamentals(s); console.log(s, JSON.stringify({ sector: f?.sector, industry: f?.industry, marketCap: f?.marketCap, operatingCashflow: f?.operatingCashflow, currency: f?.currency, fin: f?.financialCurrency })); }' > dry-run/bbox.log 2>&1
          exit 0
          node -e '
            const fs=require("fs"); const s=JSON.parse(fs.readFileSync("dry-run/scan.json"));
            const r=s.items.filter(i=>/Real Estate|REIT/i.test((i.sector||"")+(i.industry||"")));
            fs.writeFileSync("dry-run/scan-reits.json", JSON.stringify({scoringVersion:s.scoringVersion, reitPocf:s.reitPocf, count:s.items.length, good:s.items.filter(i=>i.longTerm.verdict==="Good entry").length, items:r.map(i=>({symbol:i.symbol,deep:i.deep,industry:i.industry,score:i.longTerm.score,verdict:i.longTerm.verdict,reit:i.longTerm.reit??null,value:i.longTerm.pillars.find(p=>p.key==="value"),sv:i.sectorValue}))},null,1));' >> dry-run/scan.log 2>&1
          rm -f dry-run/scan.json
          DRY_RUN=1 FORCE_RESEARCH=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node -e '
            const fs=require("fs"); const s=JSON.parse(fs.readFileSync("dry-run/research.json"));
            const r=s.items.filter(i=>/Real Estate|REIT/i.test((i.sector||"")+(i.industry||"")));
            const d=JSON.parse(fs.readFileSync("dry-run/data.json"));
            fs.writeFileSync("dry-run/research-reits.json", JSON.stringify({scoringVersion:s.scoringVersion, items:r.map(i=>({symbol:i.symbol,score:i.longTerm.score,verdict:i.longTerm.verdict,reit:i.longTerm.reit??null,value:i.longTerm.pillars.find(p=>p.key==="value"),sv:i.sectorValue,rc:i.ruleChange})), picks:(d.copilot?.picks??[]).map(p=>({symbol:p.symbol,verdict:p.verdict,score:p.score,ok:p.ok,reitVerdict:p.reitVerdict,reitOk:p.reitOk}))},null,1));' >> dry-run/monitor.log 2>&1
          rm -f dry-run/scan.json
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
