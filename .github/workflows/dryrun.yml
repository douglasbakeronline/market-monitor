name: Dry run
# 19 Nov 11:41 build: pot holdings' sell dates (heldLine); monitor, held line from the real pot, tests.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -f dry-run/*.html dry-run/*.gz dry-run/*.json dry-run/probe.log
          mkdir -p dry-run
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node -e 'Promise.all([import("./src/shortTerm.js"), import("node:fs")]).then(([m, fs]) => { const p = JSON.parse(fs.readFileSync("history/short-pot.json", "utf8")); console.log(m.heldLine(p.open)); for (const t of (p.trades ?? []).filter((t) => t.status === "closed")) console.log(t.ticker, t.kind, t.entryDate, "exit close", t.exitDate, "calendar latest", JSON.stringify(m.exitBy(t))); })' > dry-run/held.log 2>&1; echo "exit=$?" >> dry-run/held.log
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
