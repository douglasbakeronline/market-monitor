name: Dry run
# 19 Nov 14:41 build: results timing (before the open / after the close); scan, monitor, tests.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -rf dry-run
          mkdir -p dry-run
          node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          cp scan.json dry-run/scan.json
          node -e 'const p=require("./scan.json").resultsPreview; for (const r of [...p.focus, ...p.watch]) console.log(r.ticker, r.date, "after=" + r.after)' > dry-run/timing.log 2>&1
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          cp data.json dry-run/data.json
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
