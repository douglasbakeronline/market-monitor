name: Dry run
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          node tools/tier-backtest.mjs > dry-run/tier-backtest.json 2> dry-run/tier-backtest.log; echo "exit=$?" >> dry-run/tier-backtest.log
          SEC_CONTACT="${{ secrets.SEC_CONTACT }}" node tools/smart-money.mjs dry-run/smart-money.json > dry-run/smart-money-summary.json 2> dry-run/smart-money.log; echo "exit=$?" >> dry-run/smart-money.log
          cp data/cusip-map.json dry-run/ 2>/dev/null
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
