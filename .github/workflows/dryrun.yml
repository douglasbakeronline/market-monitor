name: Dry run
# Short-term pot, 11 Nov: scan (forced list, pot from 10 Nov), then the push text.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          SHORT_FORCE=1 SHORT_POT_START=2026-11-10 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          cp history/short-signals.json history/short-pot.json dry-run/ 2>/dev/null
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
