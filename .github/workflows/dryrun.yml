name: Dry run
# Short-term pot drawdown alert and digest line, 11 Nov.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          DRY_RUN=1 SHORT_FORCE=1 SHORT_POT_START=2026-10-20 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          cp dry-run/scan.json scan.json
          cp dry-run/history/short-pot.json history/short-pot.json
          node -e 'const s=require("./scan.json").shortTerm;console.log(JSON.stringify(s.pot))' > dry-run/pot.json
          DRY_RUN=1 FORCE_DIGEST=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          cp dry-run/data.json data.json
          rm -f dry-run/scan.json
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
