name: Dry run
# 18 Nov 22:41: company names (shortName), monitor plus the pot push text.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -f dry-run/*.html dry-run/*.gz dry-run/*.json dry-run/probe.log
          mkdir -p dry-run
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          node -e 'import("./src/shortTerm.js").then(async (m) => { const fs = await import("node:fs"); const s = JSON.parse(fs.readFileSync("scan.json", "utf8")); const a = m.shortTermAlert({ ...s.shortTerm, pushedAt: null }); console.log(a ? a.title + "\n" + a.body : "no alert"); })' > dry-run/push.log 2>&1; echo "exit=$?" >> dry-run/push.log
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
