name: Dry run
# 19 Nov 19:41 build: price alert tiers and "% to go"; monitor, tests, digest line.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -rf dry-run
          mkdir -p dry-run
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          cp data.json dry-run/data.json
          node --input-type=module -e 'import { parseAlerts, checkAlerts, digestLine, fileWith, latestPrice } from "./src/priceAlerts.js"; import fs from "fs"; const d = JSON.parse(fs.readFileSync("data.json")); const v = d.priceAlerts.items; console.log(JSON.stringify(v.map((a) => [a.id, a.price]))); console.log(digestLine(v, 20)); const f = JSON.parse(fs.readFileSync("price-alerts.json")).alerts; console.log("roundtrip", JSON.stringify(fileWith(v)) === JSON.stringify(f));' > dry-run/alerts.log 2>&1
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
