name: Dry run
# 20 Nov daily run: buy-tier and crash pushes say the agreed plan (dryrun-only thresholds).
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -rf dry-run
          mkdir -p dry-run
          # dryrun-only: first tier at -8% and crash watch at a 1.9% fall, so today's real data (S&P -8.2%, -2.0% on the day, F&G 19) fires both pushes.
          sed -i 's/{ drawdown: -10, label/{ drawdown: -8, label/; s/dayDrop: -3,/dayDrop: -1.9,/' src/config.js
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          git checkout src/config.js
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
