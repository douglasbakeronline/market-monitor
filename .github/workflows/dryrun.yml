name: Dry run
# Buffett lens spot check (15 Nov): raw Yahoo annual accounts for nine names.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          node tools/buffett-inputs.mjs ULVR.L,DGE.L,III.L,KO,ADBE,AAPL,CB,SYF,BGEO.L > dry-run/buffett-inputs.json 2> dry-run/buffett-inputs.log; echo "exit=$?" >> dry-run/buffett-inputs.log
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
