name: Dry run
# Probe: VWRP holdings sources from the runner (16 Nov).
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -A "$UA" -o dry-run/sa.html -w "sa %{http_code} %{size_download}\n" "https://stockanalysis.com/quote/lon/VWRP/holdings/" > dry-run/probe.log 2>&1
          curl -sSL -A "$UA" -o dry-run/sa-etf.html -w "sa-etf %{http_code} %{size_download}\n" "https://stockanalysis.com/etf/vt/holdings/" >> dry-run/probe.log 2>&1
          curl -sSL -A "$UA" -o dry-run/vg.json -w "vg %{http_code} %{size_download}\n" "https://www.vanguardinvestor.co.uk/api/funds/9679/portfolio/holdings" >> dry-run/probe.log 2>&1
          curl -sSL -A "$UA" -o dry-run/vgus.json -w "vgus %{http_code} %{size_download}\n" "https://investor.vanguard.com/investment-products/etfs/profile/api/VT/portfolio-holding/stock" >> dry-run/probe.log 2>&1
          gzip -k dry-run/*.html
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
