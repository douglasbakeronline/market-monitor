name: Dry run
# 20 Nov 11:41 build: latest results from seen dates, forward P/E data check, price alert follow-through.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          rm -rf dry-run
          mkdir -p dry-run
          # dryrun-only: two old fires in the reached log so the follow-through has something due.
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("state.json"));s.priceAlertLog=[...(s.priceAlertLog||[]),{id:"AAPL<250",symbol:"AAPL",dir:"below",level:250,price:250,at:"2026-10-15T15:00:00Z"},{id:"HSBA.L<1000",symbol:"HSBA.L",dir:"below",level:1000,price:1000,at:"2026-11-10T09:00:00Z"}];fs.writeFileSync("state.json",JSON.stringify(s,null,2))'
          DRY_RUN=1 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          DRY_RUN=1 node monitor.js > dry-run/monitor.log 2>&1; echo "exit=$?" >> dry-run/monitor.log
          cp scan.json dry-run/
          node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("dry-run/state.json")).priceAlertLog,null,1))' > dry-run/alertlog.txt 2>&1
          node --test test/*.test.js > dry-run/tests.log 2>&1; echo "exit=$?" >> dry-run/tests.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -A -f dry-run && git commit -qm "dry-run output" && git push -q
