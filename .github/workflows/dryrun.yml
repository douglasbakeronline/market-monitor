name: Dry run
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          set +e
          mkdir -p dry-run
          if [ -n "$SEC_CONTACT" ]; then echo "SEC_CONTACT set" > dry-run/smart.log; else echo "SEC_CONTACT missing" > dry-run/smart.log; fi
          node tools/smart-money.mjs dry-run/smart-money.json >> dry-run/smart.log 2>&1; echo "exit=$?" >> dry-run/smart.log
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
