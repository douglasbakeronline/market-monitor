name: Dry run
# Picks' results-day moves on Yahoo's timed dates, 12 Nov.
on:
  push:
    branches: [dryrun]
permissions:
  contents: write
  actions: read
jobs:
  dry:
    if: "!contains(github.event.head_commit.message, 'dry-run output')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: |
          set +e
          mkdir -p dry-run
          DRY_RUN=1 node scan.js > dry-run/scan.log 2>&1; echo "exit=$?" >> dry-run/scan.log
          rm -f dry-run/scan.json
      - run: |
          git config user.name "dry"; git config user.email "bot@users.noreply.github.com"
          git add -f dry-run && git commit -qm "dry-run output" && git push -q
