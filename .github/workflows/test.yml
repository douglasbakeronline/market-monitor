name: Tests
on:
  push:
    paths: ["**.js", "package.json", ".github/workflows/test.yml"]
  pull_request:
jobs:
  test:
    if: github.actor != 'dip-monitor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm test
