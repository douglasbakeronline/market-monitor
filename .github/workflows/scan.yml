name: Index scan

# Scores every S&P 500 and FTSE 100 company once each weeknight, after the
# US close. Timing isn't critical (it only has to finish before the UK open),
# so GitHub's own cron is fine here. Runs separately from the alert chain.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  push:
    branches: [main]
    paths: [".github/workflows/scan.yml", "scan.js", "trends.js", "src/themes.js", "src/data/constituents.js", "src/data/quotes.js", "src/smartMoney.js", "src/evSample.js", "tools/smart-money.mjs"]
  workflow_dispatch: {}

concurrency:
  group: index-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Smart money (display-only tags): 13F holdings of five long-term managers.
      # 13Fs change quarterly, so refresh on Monday nights or when missing.
      - name: Smart money
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f data/smart-money.json ]; then node tools/smart-money.mjs; else echo "Not Monday; keeping data/smart-money.json."; fi
      - name: Scan
        run: node scan.js
      - name: Trends
        continue-on-error: true
        run: node trends.js
      - name: Save
        env:
          COMMIT_MSG: Update index scan
        run: scripts/persist.sh scan.json data/constituents.json trends.json history/paper-trades.json history/results-dates.json history/swing-lab.json history/swing-book.json history/drift-book.json history/momentum-book.json history/buffett-book.json data/buffett.json data/buffett-sample.json data/results-check.json data/ev-sample.json
      # Separate so a missing smart-money file can never block the scan commit.
      - name: Save smart money
        if: always()
        continue-on-error: true
        env:
          COMMIT_MSG: Update smart money
        run: |
          files=""; for f in data/smart-money.json data/cusip-map.json; do [ -f "$f" ] && files="$files $f"; done
          if [ -n "$files" ]; then scripts/persist.sh $files; else echo "No smart-money files."; fi
