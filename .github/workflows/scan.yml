name: Index scan

# Scores every S&P 500 and FTSE 100 company once each weeknight, after the
# US close. Timing isn't critical (it only has to finish before the UK open),
# so GitHub's own cron is fine here. Runs separately from the alert chain.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  push:
    branches: [main]
    paths: [".github/workflows/scan.yml", "scan.js", "src/data/constituents.js", "src/data/quotes.js"]
  workflow_dispatch: {}

concurrency:
  group: index-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Scan
        run: node scan.js
      - name: Save
        env:
          COMMIT_MSG: Update index scan
        run: scripts/persist.sh scan.json data/constituents.json
