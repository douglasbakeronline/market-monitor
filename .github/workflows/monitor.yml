name: Market monitor

# GitHub's own schedule runs hours late, so it's only used to WAKE the job.
# Each run does a catch-up pass, then sleeps until the next slot in
# src/config.js (accurate to a minute or two), runs it, and starts the next
# run itself. Overnight and at weekends it relays (sleep ~5h40m, hand over).
# The cron lines restart the chain if it ever breaks.
on:
  schedule:
    - cron: "5 2,4,6 * * 1-5"    # weekday wake-ups ahead of the UK open
    - cron: "5 10,14,18 * * 1-5" # safety net during the day
    - cron: "5 12,15 * * 0"      # Sunday: weekly digest
  push:
    branches: [main]
    paths: [".github/workflows/monitor.yml", "monitor.js", "src/**", "research-list.json"]
  workflow_dispatch: {}

# Only one run at a time; a newer queued run replaces an older queued one.
concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # A failed run must not break the chain, so these steps never stop the job.
      - name: Catch-up run
        continue-on-error: true
        run: node monitor.js
      - name: Save
        continue-on-error: true
        run: scripts/persist.sh

      - name: Find next slot
        id: next
        run: node scripts/next-slot.js

      - name: Wait for ${{ steps.next.outputs.slot }}
        if: steps.next.outputs.within == 'true'
        run: sleep ${{ steps.next.outputs.wait }}

      - name: Run ${{ steps.next.outputs.slot }}
        if: steps.next.outputs.within == 'true'
        continue-on-error: true
        env:
          SLOT: ${{ steps.next.outputs.slot }}
        run: |
          git pull -q --rebase origin main
          node monitor.js
      - name: Save slot
        if: steps.next.outputs.within == 'true'
        continue-on-error: true
        env:
          SLOT: ${{ steps.next.outputs.slot }}
        run: scripts/persist.sh

      # Next slot too far away (overnight / weekend): wait as long as a job may,
      # then hand over to a fresh run, so we never depend on GitHub's late cron.
      - name: Relay towards ${{ steps.next.outputs.slot }}
        if: steps.next.outputs.within != 'true'
        env:
          WAIT: ${{ steps.next.outputs.wait }}
        run: |
          s=$(( WAIT - 20400 )); [ "$s" -gt 20400 ] && s=20400
          echo "Relaying: sleeping ${s}s"; sleep "$s"

      - name: Start next run
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main
